<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020c1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Avgående – Skurup</title>
<style>
  /* Skånetrafiken/SJ-tavla: LED-palett = grönt (data), vitt (svenska + info),
     gult (engelska etiketter). Medvetet INGET rött — riktiga tavlor kan inte visa
     det. Signatur: glansig blå radgradient + tunna svarta fogar + levande klocka. */
  :root {
    --bg: #000308;
    --panel: #02101f;
    --green: #57f58a;
    --green-dim: #3f9e67;
    --white: #eaf1ff;
    --white-dim: #9fb4d0;
    --yellow: #ffd21e;
    --seam: #000308;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--green);
    font-family: "Helvetica Neue", Arial, "Segoe UI", Roboto, sans-serif;
    font-weight: 700; -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .board { max-width: 640px; margin: 0 auto; background: var(--panel); min-height: 100vh; }

  /* Rubrikrad: Avgående / Departures + levande klocka */
  .topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; padding: 14px 14px 10px;
    background: linear-gradient(180deg, #041a34, #02101f);
    border-bottom: 2px solid var(--seam);
  }
  .title { font-size: 1.5rem; letter-spacing: 0.01em; line-height: 1; }
  .title .sv { color: var(--white); }
  .title .en { color: var(--yellow); }
  .clock { color: var(--green); font-size: 1.5rem; line-height: 1; }

  .stationline {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; padding: 8px 14px 12px; flex-wrap: wrap;
  }
  .stationline .stn { color: var(--white); font-size: 0.95rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .stationline .upd { color: var(--white-dim); font-size: 0.72rem; font-weight: 400; }
  .stationline .stale { color: var(--yellow); font-weight: 700; }

  .grp { margin-top: 6px; }
  .dirbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; color: var(--white); font-size: 0.82rem;
    letter-spacing: 0.04em; background: #06182f;
    border-top: 2px solid var(--seam); border-bottom: 2px solid var(--seam);
  }
  .dirbar .arw { color: var(--yellow); }

  .row, .colhead {
    display: grid; grid-template-columns: 70px 1fr 34px; gap: 10px;
    align-items: center; padding: 9px 14px;
  }
  .colhead {
    padding-top: 6px; padding-bottom: 6px; align-items: end;
    line-height: 1.05; background: #030f1e;
  }
  .colhead b { display: block; color: var(--white); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.03em; }
  .colhead i { display: block; color: var(--yellow); font-size: 0.62rem; font-style: normal; font-weight: 700; }
  .colhead .c-spar { text-align: right; }

  ul { list-style: none; margin: 0; padding: 0; }
  li.row {
    position: relative; margin-bottom: 2px;
    background: linear-gradient(93deg, #0a2044 0%, #16457f 42%, #103068 68%, #0a2145 100%);
  }
  li.row::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0) 46%);
  }
  li.past { opacity: 0.38; }

  .c-tid { display: flex; flex-direction: column; gap: 1px; }
  .c-tid .adv { font-size: 1.2rem; color: var(--green); line-height: 1.05; }
  .c-tid .adv.struck { font-size: 0.92rem; color: var(--green-dim); text-decoration: line-through; }
  .c-tid .nytid { font-size: 1.05rem; color: var(--white); line-height: 1.05; }  /* Ny tid */
  .c-tid .rel { font-size: 0.66rem; font-weight: 400; color: var(--green-dim); }
  .c-tid .rel.soon { color: var(--yellow); }
  .c-tid .mark { color: var(--yellow); }

  .c-dest .dest { font-size: 1.12rem; color: var(--green); line-height: 1.1; }
  .c-dest .anm { font-size: 0.72rem; font-weight: 400; color: var(--white-dim); margin-top: 2px; }
  .c-dest .anm .kw { color: var(--yellow); font-weight: 700; }
  li.canceled .dest { color: var(--white-dim); text-decoration: line-through; }

  .c-spar { text-align: right; font-size: 1.2rem; color: var(--green); }

  .msg { padding: 40px 16px; text-align: center; color: var(--green); font-weight: 700; }
  .footer { padding: 18px 14px 30px; text-align: center; color: var(--white-dim); font-size: 0.68rem; font-weight: 400; }
</style>
</head>
<body>
<div class="board">
  <div class="topbar">
    <div class="title"><span class="sv">Avgående</span> <span class="en">Departures</span></div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
  <div class="stationline">
    <span class="stn">Skurup · Näsbyholm</span>
    <span class="upd" id="updated"></span>
  </div>
  <div id="body"><div class="msg">Laddar…</div></div>
  <div class="footer">Trafikverket öppna data · Ystadbanan · uppdateras varje timme</div>
</div>

<script>
const BACK_H = 2, FWD_H = 4;
// Datan uppdateras timvis av board.yml och publiceras på data-grenen (fristående
// från den tunga historik-pipelinen). raw.githubusercontent är CORS-öppen.
const DATA_URL = "https://raw.githubusercontent.com/johanhessler/nasbyholm-station/data/departures.json";
const svTime = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Stockholm", hour: "2-digit", minute: "2-digit" });
const svClock = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Stockholm", hour: "2-digit", minute: "2-digit", second: "2-digit" });
const hhmm = (epoch) => svTime.format(new Date(epoch * 1000));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

let data = null;

function relLabel(sec) {
  const m = Math.round(sec / 60);
  if (m === 0) return { txt: "avgår nu", soon: true };
  if (m > 0) {
    if (m < 60) return { txt: "om " + m + " min", soon: m <= 15 };
    const h = Math.floor(m / 60), r = m % 60;
    return { txt: "om " + h + " h" + (r ? " " + r + " min" : ""), soon: false };
  }
  const am = -m;
  if (am < 60) return { txt: am + " min sedan", soon: false };
  const h = Math.floor(am / 60), r = am % 60;
  return { txt: h + " h" + (r ? " " + r + " min" : "") + " sedan", soon: false };
}

function tick() {
  const el = document.getElementById("clock");
  if (el) el.textContent = svClock.format(new Date());
}

function render() {
  const body = document.getElementById("body");
  const upd = document.getElementById("updated");
  if (!data) return;

  const now = Date.now() / 1000;
  const lo = now - BACK_H * 3600, hi = now + FWD_H * 3600;

  const ageMin = Math.round((now - data.generated_epoch) / 60);
  const stale = ageMin > 75;
  upd.innerHTML = "Uppdaterad " + hhmm(data.generated_epoch)
    + (stale ? ' <span class="stale">· kan vara inaktuell</span>' : "");

  const inWin = data.departures.filter(d => d.effective_epoch >= lo && d.effective_epoch <= hi);
  if (!inWin.length) {
    body.innerHTML = '<div class="msg">Inga avgångar de närmaste timmarna.</div>';
    return;
  }

  const groups = [
    { name: "Mot Ystad/Simrishamn", arw: "→" },
    { name: "Mot Malmö/Helsingborg", arw: "←" },
  ];

  let html = "";
  for (const g of groups) {
    const rows = inWin.filter(d => d.direction === g.name)
                      .sort((a, b) => a.effective_epoch - b.effective_epoch);
    if (!rows.length) continue;

    const nextIdx = rows.findIndex(d => d.effective_epoch >= now && !d.canceled);

    html += '<section class="grp">'
          + '<div class="dirbar"><span class="arw">' + g.arw + "</span>" + esc(g.name) + "</div>"
          + '<div class="colhead">'
          +   '<div class="c-tid"><b>Tid</b><i>Time</i></div>'
          +   '<div class="c-dest"><b>Destination</b><i>Destination</i></div>'
          +   '<div class="c-spar"><b>Spår</b><i>Track</i></div>'
          + "</div><ul>";

    rows.forEach((d, i) => {
      const past = d.effective_epoch < now;
      const isNext = i === nextIdx;
      const delayed = !d.canceled && d.delay_minutes != null && d.delay_minutes >= 1;
      const early = !d.canceled && d.delay_minutes != null && d.delay_minutes <= -1;

      // Tid-kolumn: annonserad tid; vid försening struken + ny tid (vit).
      let tid = "";
      if (isNext) tid += '<span class="mark">▸</span> ';
      tid = '<span class="adv' + (delayed ? " struck" : "") + '">' + tid + hhmm(d.advertised_epoch) + "</span>";
      if (delayed || early) tid += '<span class="nytid">' + hhmm(d.effective_epoch) + "</span>";
      if (!d.canceled) {
        const r = relLabel(d.effective_epoch - now);
        tid += '<span class="rel' + (r.soon ? " soon" : "") + '">' + r.txt + "</span>";
      }

      // Anmärkning: tågslag + tågnr, plus nyckelord i gult.
      const parts = [esc(d.train_type), esc(d.train_ident)].filter(Boolean).join(" · ");
      let kw = "";
      if (d.canceled) kw = ' · <span class="kw">Inställt</span>';
      else if (delayed) kw = ' · <span class="kw">Försenat</span>';

      const spar = d.canceled ? "×" : esc(d.track || "–");

      html += '<li class="row' + (past ? " past" : "") + (d.canceled ? " canceled" : "") + '">'
            + '<div class="c-tid">' + tid + "</div>"
            + '<div class="c-dest"><div class="dest">' + esc(d.to_name) + "</div>"
            +   '<div class="anm">' + parts + kw + "</div></div>"
            + '<div class="c-spar">' + spar + "</div>"
            + "</li>";
    });
    html += "</ul></section>";
  }
  body.innerHTML = html || '<div class="msg">Inga avgångar de närmaste timmarna.</div>';
}

async function load() {
  try {
    const res = await fetch(DATA_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    render();
  } catch (e) {
    if (!data) document.getElementById("body").innerHTML =
      '<div class="msg">Kunde inte hämta avgångar.</div>';
  }
}

tick();
load();
setInterval(tick, 1000);                 // levande klocka
setInterval(render, 20 * 1000);          // relativa tider live
setInterval(load, 5 * 60 * 1000);        // ny data när ett nytt bygge körts
document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); load(); } });
</script>
</body>
</html>
