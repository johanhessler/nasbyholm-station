name: Avgångstavla (timvis)

# Lättviktig, timvis uppdatering av den mobila avgångstavlan (Skurup, −2/+4h).
# Helt fristående från daily.yml: inga DuckLake/dbt/Azure — bara ett par
# API-anrop till Trafikverket. Resultatet (departures.json) force-pushas som en
# enda rullande commit på data-grenen; mobiltavlan hämtar den klientsidan via
# raw.githubusercontent (CORS-öppen). Pushen triggar inga andra workflows.

on:
  schedule:
    - cron: "0 * * * *"    # varje hel timme (UTC)
  workflow_dispatch:

concurrency:
  group: board-hourly
  cancel-in-progress: true

permissions:
  contents: write         # för att kunna push:a data-grenen

env:
  TRAFIKVERKET_API_KEY: ${{ secrets.TRAFIKVERKET_API_KEY }}

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installera requests
        run: pip install requests

      - name: Hämta avgångar -> departures.json
        run: python fetch_board.py

      - name: Publicera till data-grenen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rullande engångscommit: ingen historik ackumuleras på data-grenen.
          git checkout --orphan data
          git rm -r --cached . >/dev/null 2>&1 || true
          git add -f departures.json
          git commit -m "Avgångstavla $(date -u +%FT%TZ)"
          git push -f origin data
